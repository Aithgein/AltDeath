name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "xmake.lua"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "src/**"
      - "xmake.lua"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out addon
        uses: actions/checkout@v7

      - name: Fetch CommonLibSSE-NG
        shell: pwsh
        run: |
          git clone --recursive --depth 1 https://github.com/libxse/commonlibsse.git lib/commonlibsse

      - name: Fetch SKSE Menu Framework header
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/Thiago099/SKSE-Menu-Framework-2-Example/main/include/SKSEMenuFramework.h" `
            -OutFile "src/SKSEMenuFramework.h"

          # The framework header assumes a Unicode build and passes a wide
          # string through the GetModuleHandle macro. This project does not
          # define UNICODE, so make the intended Windows API explicit.
          $header = Get-Content "src/SKSEMenuFramework.h" -Raw
          $header = $header.Replace(
            'GetModuleHandle(L"SKSEMenuFramework")',
            'GetModuleHandleW(L"SKSEMenuFramework")')
          Set-Content "src/SKSEMenuFramework.h" -Value $header -NoNewline

      - name: Set up XMake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure
        shell: pwsh
        run: xmake f -m releasedbg -y

      - name: Build
        shell: pwsh
        run: xmake -y

      - name: Package MO2-ready ZIP
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -Filter "shades-respawn-addon.dll" | Select-Object -First 1
          if (-not $dll) { throw "Built DLL was not found" }

          $package = Join-Path $PWD "package/Data/SKSE/Plugins"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item $dll.FullName $package

          $pdb = Get-ChildItem -Path build -Recurse -Filter "shades-respawn-addon.pdb" | Select-Object -First 1
          if ($pdb) { Copy-Item $pdb.FullName $package }

          Compress-Archive -Path "package/Data" -DestinationPath "Shades-Respawn-Addon.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shades-Respawn-Addon
          path: Shades-Respawn-Addon.zip
          if-no-files-found: error
